name: Release

on:
  push:
    branches:
      - "main"

permissions:
  packages: read
  contents: write # create tags, commits, releases
  issues: write # comment on issues
  pull-requests: write # comment on PRs
  id-token: write # npm provenance (no-op if not publishing to npm)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a running release

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required by semantic-release
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm clean-install

      - name: Verify semantic-release config
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

  go-release:
    name: Go Release
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/go-release.yml
    with:
      ref: ${{ needs.release.outputs.new_release_git_tag }}
    secrets: inherit
